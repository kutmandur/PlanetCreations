<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f8f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101817" media="(prefers-color-scheme: dark)" />
    <title>Maintenance | PlanetCreations</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f6f8f7;
        --surface: rgba(255, 255, 255, 0.88);
        --surface-border: rgba(24, 91, 77, 0.13);
        --text: #17302b;
        --muted: #61706d;
        --accent: #2496b5;
        --accent-secondary: #35a84a;
        --glow-blue: rgba(36, 150, 181, 0.15);
        --glow-green: rgba(53, 168, 74, 0.12);
        --shadow: 0 24px 70px rgba(20, 57, 50, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #101817;
          --surface: rgba(24, 35, 33, 0.9);
          --surface-border: rgba(170, 219, 207, 0.14);
          --text: #edf7f4;
          --muted: #a7b7b3;
          --accent: #50b6d0;
          --accent-secondary: #64c873;
          --glow-blue: rgba(36, 150, 181, 0.18);
          --glow-green: rgba(53, 168, 74, 0.15);
          --shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: 28px;
        overflow-x: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 12%, var(--glow-green), transparent 34%),
          radial-gradient(circle at 88% 82%, var(--glow-blue), transparent 36%),
          var(--background);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        position: relative;
        width: min(100%, 680px);
        padding: clamp(32px, 7vw, 58px);
        overflow: hidden;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      main::before {
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        content: "";
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent));
      }

      .logo {
        display: block;
        width: clamp(126px, 28vw, 184px);
        height: auto;
        margin: 0 auto 30px;
        border-radius: 50%;
        filter: drop-shadow(0 12px 24px rgba(20, 57, 50, 0.14));
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 20px;
        padding: 8px 13px;
        color: var(--muted);
        background: color-mix(in srgb, var(--surface) 76%, var(--accent) 24%);
        border: 1px solid var(--surface-border);
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background: var(--accent-secondary);
        border-radius: 50%;
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent-secondary) 17%, transparent);
        animation: pulse 2.1s ease-in-out infinite;
      }

      h1 {
        max-width: 570px;
        margin: 0 auto 18px;
        font-size: clamp(2rem, 7vw, 3.25rem);
        line-height: 1.04;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }

      p {
        max-width: 520px;
        margin: 0 auto;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.16rem);
        line-height: 1.65;
        text-wrap: pretty;
      }

      .note {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid var(--surface-border);
        font-size: 0.88rem;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.55;
          transform: scale(0.82);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot {
          animation: none;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        main {
          padding: 34px 22px;
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/logo.png" alt="PlanetCreations" />
      <div class="status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        Maintenance in progress
      </div>
      <h1>Temporarily unavailable for maintenance</h1>
      <p>
        PlanetCreations is getting an upgrade. We’ll be back shortly with everything
        ready for your next creation.
      </p>
      <p class="note">Thank you for your patience.</p>
    </main>
  </body>
</html>
