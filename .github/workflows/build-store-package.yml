name: Build Microsoft Store AppX

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref containing the Store-ready source
        required: true
        default: main
        type: string
      release_tag:
        description: Optional existing draft release to receive the AppX
        required: false
        default: ''
        type: string

jobs:
  build-store-package:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop and frontend tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Microsoft Store AppX
        run: npm run package:store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          PLANETCREATIONS_DISTRIBUTION_CHANNEL: store
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}

      - name: Verify Microsoft Store package contents
        run: npm run verify:store-package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-appx-${{ github.run_number }}
          path: dist/store/*.appx
          if-no-files-found: error
          retention-days: 30

      - name: Attach AppX to existing draft release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $appx = @(Get-ChildItem -LiteralPath 'dist/store' -Filter '*.appx')
          if ($appx.Count -ne 1) {
            throw "Expected exactly one AppX, found $($appx.Count)."
          }
          gh release upload $env:RELEASE_TAG $appx[0].FullName --clobber
