name: Verify macOS Signing

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch or tag to package (defaults to the workflow ref)
        required: false
        type: string

jobs:
  verify-macos:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Check out git repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run desktop and frontend tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # dmg-license kann in einem unter Windows erzeugten Lockfile fehlen.
      - name: Install macOS DMG dependency
        run: npm install dmg-license --no-save

      - name: Prepare required Apple signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          SECRET_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SECRET_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          missing=()
          [ -z "$MAC_CSC_LINK" ] && missing+=("MAC_CSC_LINK")
          [ -z "$MAC_CSC_KEY_PASSWORD" ] && missing+=("MAC_CSC_KEY_PASSWORD")
          [ -z "$APPLE_API_KEY_P8_BASE64" ] && missing+=("APPLE_API_KEY_P8_BASE64")
          [ -z "$SECRET_APPLE_API_KEY_ID" ] && missing+=("APPLE_API_KEY_ID")
          [ -z "$SECRET_APPLE_API_ISSUER" ] && missing+=("APPLE_API_ISSUER")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required macOS signing secrets: ${missing[*]}"
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${SECRET_APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A -out "$key_path"
          chmod 600 "$key_path"

          echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$SECRET_APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$SECRET_APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS artifacts
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.['build:electron'] ? 0 : 1)"; then
            npm run build:electron
          else
            npm run build
          fi

          npx electron-builder --mac --publish never --config.mac.forceCodeSigning=true
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}

      - name: Verify signature, Gatekeeper and notarization
        shell: bash
        run: |
          set -euo pipefail

          apps_found=0
          while IFS= read -r app; do
            apps_found=$((apps_found + 1))
            echo "Verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done < <(find dist -type d -name 'PlanetCreations Client.app' -prune -print)

          if [ "$apps_found" -eq 0 ]; then
            echo "::error::No packaged macOS app bundle was found."
            exit 1
          fi

          dmg_count=$(find dist -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          zip_count=$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')

          if [ "$dmg_count" -eq 0 ] || [ "$zip_count" -eq 0 ]; then
            echo "::error::Expected both DMG and ZIP artifacts."
            exit 1
          fi

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: verified-macos-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
