name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "${GITHUB_REF_NAME#v}" \
              --target "$GITHUB_SHA"
          fi

  release:
    needs: prepare-release

    strategy:
      # Ein fehlgeschlagener Plattform-Build soll die anderen nicht abbrechen
      # (z. B. macOS-Probleme dürfen das Windows-Release nicht blockieren).
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run desktop and frontend tests
        run: npm test

      # dmg-license ist eine macOS-only optionale Dependency des DMG-Builders.
      # Sie fällt aus dem package-lock.json heraus, wenn dieses auf Windows/Linux
      # erzeugt wurde, wodurch der Mac-Build sonst mit "Cannot find module
      # 'dmg-license'" abbricht. --no-save lässt das Lockfile unverändert.
      - name: Install macOS DMG dependency
        if: matrix.os == 'macos-latest'
        run: npm install dmg-license --no-save

      - name: Prepare optional Apple signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          OPTIONAL_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          OPTIONAL_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            if [ -n "$MAC_CSC_KEY_PASSWORD" ]; then
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            fi
          fi

          if [ -n "$APPLE_API_KEY_P8_BASE64" ] &&
             [ -n "$OPTIONAL_APPLE_API_KEY_ID" ] &&
             [ -n "$OPTIONAL_APPLE_API_ISSUER" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${OPTIONAL_APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A -out "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$OPTIONAL_APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$OPTIONAL_APPLE_API_ISSUER" >> "$GITHUB_ENV"
          fi

      # electron-builder baut je Runner sein natives Target (NSIS/DMG/AppImage)
      # und lädt alle Artefakte in dasselbe GitHub-Draft-Release hoch.
      # Auf macOS signiert und notarisiert electron-builder automatisch, sobald
      # die Zertifikats- und Apple-API-Key-Secrets unten eingerichtet sind.
      # Ohne diese Secrets entsteht weiterhin ein unsigniertes Testartefakt.
      - name: Build and release Electron app
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
