name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    strategy:
      # Ein fehlgeschlagener Plattform-Build soll die anderen nicht abbrechen
      # (z. B. macOS-Probleme dürfen das Windows-Release nicht blockieren).
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # dmg-license ist eine macOS-only optionale Dependency des DMG-Builders.
      # Sie fällt aus dem package-lock.json heraus, wenn dieses auf Windows/Linux
      # erzeugt wurde, wodurch der Mac-Build sonst mit "Cannot find module
      # 'dmg-license'" abbricht. --no-save lässt das Lockfile unverändert.
      - name: Install macOS DMG dependency
        if: matrix.os == 'macos-latest'
        run: npm install dmg-license --no-save

      # electron-builder baut je Runner sein natives Target (NSIS/DMG/AppImage)
      # und lädt alle Artefakte in dasselbe GitHub-Draft-Release hoch.
      # macOS wird unsigniert gebaut (identity: null in package.json) — Erststart
      # per Rechtsklick > Öffnen; Auto-Update ist auf dem Mac ohne Signierung
      # nicht möglich (Updates manuell von der Release-Seite laden).
      - name: Build and release Electron app
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Unsignierte Mac-Builds: electron-builder soll nicht nach
          # Zertifikaten suchen oder Notarisierung versuchen.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
