<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Restore the user's chosen view mode (mobile vs. forced desktop) before React
      // loads, so there is no layout flash. Toggled via the footer "Desktop view" button.
      (function () {
        try {
          if (localStorage.getItem('pcViewMode') === 'desktop') {
            var m = document.querySelector('meta[name="viewport"]');
            if (m) m.setAttribute('content', 'width=1280');
          }
        } catch (e) {}
      })();
      // Apply the dark/light theme before React mounts (no flash). 'pcTheme' is
      // 'dark'/'light' for an explicit choice, or unset to follow the OS setting.
      (function () {
        try {
          var t = localStorage.getItem('pcTheme');
          var dark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A hub for your park- and zoo-builder creations."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon-V2?v=3.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta property="og:type" content="website">
    <meta property="og:title" content="PlanetCreations">
    <meta property="og:description" content="A hub for your park- and zoo-builder creations.">
    <meta property="og:image" content="%PUBLIC_URL%/logo.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PlanetCreations">
    <meta name="twitter:description" content="A hub for your park- and zoo-builder creations.">
    <meta name="twitter:image" content="%PUBLIC_URL%/logo.png">

    <title>PlanetCreations</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
